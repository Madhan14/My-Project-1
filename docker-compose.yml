version: "3.9"
services:
  web:
    image: "${IMAGE:-yourdockerhubusername/dev:latest}"
    container_name: devops-web
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","wget -q -O - http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
